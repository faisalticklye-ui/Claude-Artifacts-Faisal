<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>My Portfolio Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0F14;--surface:#121820;--surface2:#161D26;--surface3:#1B232D;
  --line:#1F2833;--line2:#1A222C;--line3:#2A3542;
  --text:#E6EDF3;--text2:#B7C2CD;--muted:#8B98A5;
  --accent:#D9B45B;--accent2:#F0CF7E;--good:#4CC38A;--bad:#F2685C;--warn:#E8A23A;
  --goodbg:rgba(76,195,138,.12);--badbg:rgba(242,104,92,.12);--warnbg:rgba(232,162,58,.13);--accbg:rgba(217,180,91,.12);
  --c-stock:#6FA8FF;--c-mf:#A08CF5;--c-etf:#43C6C0;--c-gold:#D9B45B;--c-btc:#F07B3F;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding:4px 2px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px;color:var(--text2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.btn{font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;border:1px solid var(--line3);background:var(--surface2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:36px}
.btn:hover{background:#1E2733}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0B0F14;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#0B0F14;font-weight:600}
.btn.sm{font-size:12px;padding:5px 10px;min-height:30px}
.icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--line3)}
.icon-btn.del:hover{color:var(--bad)}
.fab{width:40px;height:40px;border-radius:10px;background:var(--accent);border:none;color:#0B0F14;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.fab:hover{background:var(--accent2)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 16px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:10px;background:var(--surface3);color:var(--text2)}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:18px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{margin:0;font-size:15px;font-weight:600}
h3{margin:0;font-size:13px;font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:15px 17px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.stat .s{font-family:var(--mono);font-size:12px;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:11px 14px;border:1px dashed var(--line3);border-radius:10px;font-size:13px;color:var(--text2);background:var(--accbg)}

.legend-row{display:flex;align-items:center;gap:10px;font-size:13px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;border:1px solid var(--line3);background:transparent;color:var(--text2)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.filters{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:12px;color:var(--muted);min-width:64px}

.tag{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid currentColor;white-space:nowrap;flex:none;line-height:1.5}
.tag.sip{color:var(--good)}.tag.lump{color:var(--text2)}.tag.paused{color:var(--warn)}.tag.sample{color:var(--muted);border-style:dashed}

/* holdings */
.hcard{overflow:hidden}
.hhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px;gap:8px;flex-wrap:wrap}
.hhead h2{display:flex;align-items:center;gap:8px}
.hscroll{overflow-x:auto}
.htable{min-width:640px}
.hrow{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr) 68px;gap:12px;padding:11px 16px;border-top:1px solid var(--line2);align-items:center}
.hrow.head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-block:8px;border-top-color:var(--line)}
.hrow .r{text-align:right;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hrow .r span:first-child{font-size:13px}
.hrow .r span+span{font-size:12px}
.hname{min-width:0;display:flex;flex-direction:column;gap:4px}
.hname .t{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.hname .n{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.hname .m{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;justify-content:flex-end;gap:2px}
.confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--badbg);border-radius:8px;padding:10px 12px;font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line2)}

/* SIP */
.siprow{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line2)}
.cal{display:flex;flex-direction:column;align-items:center;padding:6px 0;border:1px solid var(--line3);border-radius:8px}
.cal b{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1}
.cal span{font-size:10px;color:var(--muted);text-transform:uppercase}
.cal.soon{border-color:var(--accent)}

.mover{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line2)}
.mover .n{flex:1;min-width:0;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-family:var(--mono);font-size:12px;font-weight:600;min-width:66px;text-align:right;padding:2px 6px;border-radius:4px}
.pct.up{color:var(--good);background:var(--goodbg)}.pct.dn{color:var(--bad);background:var(--badbg)}

.tile{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .l{font-size:11px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:17px;font-weight:500;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line2);font-family:var(--mono);font-size:12px;gap:8px}
.kv:last-child{border-bottom:none}

.inp{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line3);background:var(--bg);color:var(--text);font-size:14px;min-height:40px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.seg{display:flex;border:1px solid var(--line3);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:none;background:var(--surface2);color:var(--text2);padding:9px 12px;cursor:pointer;font-size:13px;font-weight:500;min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#0B0F14}

.spark{width:100%;height:84px;display:block}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line3);border-radius:12px;width:100%;max-width:720px;margin-block:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:17px}
.mbody{padding:18px;display:flex;flex-direction:column;gap:18px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fs{display:flex;flex-direction:column;gap:10px}
.fs>.lg{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;color:var(--text2);font-weight:500}
.f label .req{color:var(--accent)}
.f .hint{font-size:11px;color:var(--muted)}
.f.err .inp{border-color:var(--bad)}
.f .emsg{font-size:11px;color:var(--bad)}
.calc{font-family:var(--mono);font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 18px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.upd-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}

/* watchlist */
.wadd{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:760px){.wadd{grid-template-columns:1fr 1fr}.wadd .f.wide{grid-column:1/-1}.wadd .btn{grid-column:1/-1;justify-content:center}}
.witem{border-top:1px solid var(--line2)}
.witem:first-of-type{border-top:none}
.wsum{width:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto 20px;gap:12px;align-items:center;padding:14px 16px;background:none;border:none;cursor:pointer;text-align:left;color:inherit}
.wsum:hover{background:var(--surface2)}
.wsum .tk{font-weight:600;font-size:15px}
.chev{transition:transform .15s;color:var(--muted)}
.witem.open .chev{transform:rotate(180deg)}
.wbadges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-good{color:var(--good);background:var(--goodbg)}.b-bad{color:var(--bad);background:var(--badbg)}.b-warn{color:var(--warn);background:var(--warnbg)}.b-mute{color:var(--text2);background:var(--surface3)}.b-acc{color:var(--accent);background:var(--accbg)}
.wbody{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.acard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--bg)}
.acard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acard .hd h3{display:flex;gap:8px;align-items:baseline}
.acard .hd h3 i{font-style:normal;font-family:var(--mono);color:var(--accent);font-size:12px}
.acard p{margin:0;font-size:13px;line-height:1.55;color:var(--text2)}
.acard ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--text2);display:flex;flex-direction:column;gap:3px}
.big{font-family:var(--mono);font-size:22px;font-weight:500}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.meter span{height:8px;border-radius:2px;background:var(--line3)}
.hbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:4px}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.summary{font-size:14px;line-height:1.6;color:var(--text);padding:14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.thinking{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;padding:16px;border:1px dashed var(--line3);border-radius:10px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line3);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.chev{transition:none}}

/* findings */
.frow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:13px 16px;border-top:1px solid var(--line2);align-items:start}
.frow .t{font-weight:600;font-size:14px;margin-bottom:3px}
.frow .d{font-size:13px;color:var(--text2);line-height:1.55}
.sev{justify-self:start}
.memo{font-size:14px;line-height:1.65;color:var(--text2)}
.memo h1,.memo h2,.memo h3{color:var(--text);margin:18px 0 6px;font-size:15px}
.memo h1:first-child,.memo h2:first-child,.memo h3:first-child{margin-top:0}
.memo p{margin:0 0 10px}
.memo ul,.memo ol{margin:0 0 10px;padding-left:20px}
.memo li{margin:3px 0}
.memo strong{color:var(--text)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.6;max-width:90%}
.msg.u{align-self:flex-end;background:var(--surface3);color:var(--text)}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);color:var(--text2)}
.ask{display:flex;gap:8px}
.ask textarea{flex:1;resize:vertical;min-height:44px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
footer{font-size:11px;color:var(--muted);line-height:1.65;display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.sippop{position:fixed;z-index:40;width:min(360px,calc(100vw - 32px));background:var(--surface2);border:1px solid var(--line3);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.55);overflow:hidden}
.sippop .hd{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px;border-bottom:1px solid var(--line)}
.sippop .it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line2)}
.sippop .it:first-of-type{border-top:none}
.sippop .cal{padding:3px 0}.sippop .cal b{font-size:14px}
[data-sip-tile]:hover,[data-sip-tile]:focus-visible{background:var(--surface2)}
.chart{position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .cline{position:absolute;top:0;width:1px;background:var(--text2);opacity:.5;pointer-events:none}
.chart .cdot{position:absolute;width:9px;height:9px;border-radius:50%;border:2px solid var(--bg);transform:translate(-50%,-50%);pointer-events:none}
.chart .ctip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--line3);border-radius:6px;padding:5px 8px;font-family:var(--mono);font-size:11px;white-space:nowrap;pointer-events:none;color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.chart .ctip span{color:var(--muted);display:block;font-size:10px}
.mkt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.mkt-stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mkt-stats .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mkt-stats .v{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.acbox{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;max-height:300px;overflow-y:auto;background:var(--surface2);border:1px solid var(--line3);border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,.5);min-width:min(420px,calc(100vw - 64px))}
.acopt{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;font-size:13px;border-top:1px solid var(--line2)}
.acopt:first-child{border-top:none}
.acopt:hover,.acopt.on{background:var(--surface3)}
.ftable{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
.ftable th{font-size:11px;font-weight:500;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.ftable th:first-child,.ftable td:first-child{text-align:left}
.ftable th small{display:block;font-family:var(--mono);font-size:10px;color:var(--text2);margin-top:2px}
.ftable td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ftable tr:last-child td{border-bottom:none}
.fcell{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.bb{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;flex:none}
.bb.bull{background:var(--goodbg);color:var(--good)}.bb.bear{background:var(--badbg);color:var(--bad)}.bb.na{background:var(--surface3);color:var(--muted)}
.est{font-size:9.5px;color:var(--warn);font-family:var(--sans);letter-spacing:.04em}
.sipbox{border:1px solid var(--accent);border-radius:10px;background:var(--accbg);padding:14px;display:flex;flex-direction:column;gap:12px}
.sipbox .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}

const Store = {
  mode: 'local', db: null, uid: null, q: {},
  path(n) { return 'data/users/' + this.uid + '/' + n; },
  async init() {
    const c = window.claude;
    if (!c || !c.use) return false;
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return false;
      const id = await user.id();
      if (!id) return false;
      this.db = db; this.uid = id; this.mode = 'cloud';

  async loadAll() {
    const out = {};

      const snap = await this.db.collection('data/users/' + this.uid).get();
      snap.docs.forEach(d => { if (d.exists) out[d.id] = JSON.parse(JSON.stringify(d.data())); });
      return out;
    }
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('pfd_')) { try { out[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } catch (e) {} }
      }
    } catch (e) {}
    return out;

/* ============ calculations ============ */
function curPrice(h) {
  const S = D.settings, fx = S.fx.usdInr;
  if (h.type === 'gold' && h.useRef) return S.ref.gold * (h.purity === '22K' ? 0.916 : 1);
  if (h.type === 'btc' && h.useRef) return h.currency === 'USD' ? S.ref.btc / fx : S.ref.btc;
  return +h.price || 0;
}
function fxRate(cur) { return cur === 'USD' ? D.settings.fx.usdInr : cur === 'GBP' ? D.settings.fx.usdInr * 1.27 : 1; }
function sipCount(h, to = new Date()) {
  if (h.mode !== 'SIP' || !h.date) return 0;
  const st = new Date(h.date); if (isNaN(st)) return 0;
  const end = h.sipEnd && new Date(h.sipEnd) < to ? new Date(h.sipEnd) : to;
  if (end < st) return 0;
  const f = h.sipFreq || 'Monthly';
  if (f === 'Weekly') return Math.floor(daysBetween(st, end) / 7) + 1;
  const months = (end.getFullYear() - st.getFullYear()) * 12 + end.getMonth() - st.getMonth() + (end.getDate() >= st.getDate() ? 1 : 0);
  return Math.max(1, f === 'Quarterly' ? Math.ceil(months / 3) : months);
}
function sipMonthly(h) { const a = +h.sipAmt || 0, f = h.sipFreq || 'Monthly'; return f === 'Weekly' ? a * 52 / 12 : f === 'Quarterly' ? a / 3 : a; }
function nextSip(h, today) {
  if (h.mode !== 'SIP' || h.sipStatus === 'Paused') return null;
  if (h.sipEnd && new Date(h.sipEnd) < today) return null;
  const f = h.sipFreq || 'Monthly';
  if (f === 'Weekly') { const wd = +(h.sipWeekday ?? 1); const d = new Date(today); d.setDate(d.getDate() + (wd - d.getDay() + 7) % 7); return d; }
  const day = Math.min(28, Math.max(1, +h.sipDay || 1));
  let d = new Date(today.getFullYear(), today.getMonth(), day);
  if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, day);
  if (f === 'Quarterly') { const sm = new Date(h.date || today).getMonth(); let g = 0; while ((d.getMonth() - sm + 12) % 3 !== 0 && g++ < 4) d = new Date(d.getFullYear(), d.getMonth() + 1, day); }
  return d;
}
function enrich(h) {
  const p = curPrice(h), fx = fxRate(h.currency), q = +h.qty || 0;
  const value = q * p * fx, inv = q * (+h.avg || 0) * fx, pnl = value - inv;
  const hasPrev = h.prev != null && h.prev !== '' && +h.prev > 0 && !(h.useRef);
  const day = hasPrev ? (p - h.prev) * q * fx : 0;
  const dayPct = hasPrev ? (p / h.prev - 1) * 100 : NaN;
  const held = h.date ? daysBetween(new Date(h.date), new Date()) : 0;
  return { ...h, p, value, inv, pnl, pnlPct: inv ? pnl / inv * 100 : 0, day, dayPct, held };
}
function xirr(flows) {
  if (flows.length < 2) return NaN;
  flows.sort((a, b) => a.d - b.d);
  const t0 = flows[0].d; if (flows[flows.length - 1].d - t0 < 864e5 * 30) return NaN;
  let r = 0.12;
  for (let i = 0; i < 80; i++) {
    let f = 0, df = 0;
    for (const c of flows) { const t = (c.d - t0) / 31557600000; f += c.v / Math.pow(1 + r, t); df -= t * c.v / Math.pow(1 + r, t + 1); }
    const nr = r - f / df;
    if (!isFinite(nr)) return NaN;
    if (Math.abs(nr - r) < 1e-8) return nr;
    r = Math.max(-0.99, nr);
  }
  return r;
}
function flowsFor(list) {
  const flows = [];
  list.forEach(h => {
    if (!h.inv) return;
    const st = new Date(h.date || Date.now());
    if (h.mode === 'SIP') {
      const n = Math.max(1, sipCount(h)), step = (h.sipFreq === 'Weekly') ? 7 : null;
      for (let i = 0; i < n; i++) {
        const d = step ? new Date(st.getTime() + i * 7 * 864e5) : new Date(st.getFullYear(), st.getMonth() + i * (h.sipFreq === 'Quarterly' ? 3 : 1), st.getDate());
        if (d > new Date()) break;
        flows.push({ d: d.getTime(), v: -h.inv / n });
      }
    } else flows.push({ d: st.getTime(), v: -h.inv });
  });
  const tv = list.reduce((a, b) => a + b.value, 0);
  flows.push({ d: Date.now(), v: tv });
  return flows;
}
const sum = (a, k) => a.reduce((x, y) => x + (y[k] || 0), 0);
function isEquity(h) { return h.type === 'stock' || (h.type === 'mf' && !/debt|liquid|gilt|gold/i.test(h.category || '')) || (h.type === 'etf' && !/gold|silver|debt|liquid/i.test(h.category || '')); }
function isGoldLike(h) { return h.type === 'gold' || (h.type === 'etf' && /gold/i.test(h.category || '')) || (h.type === 'mf' && /gold/i.test(h.category || '')); }

function marketOpen(tz, o, c) {
  try {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false }).formatToParts(new Date());
    const g = t => (p.find(x => x.type === t) || {}).value;
    const m = (+g('hour') % 24) * 60 + +g('minute');
    return !['Sat', 'Sun'].includes(g('weekday')) && m >= o && m < c;
  } catch (e) { return false; }
}

    <span class="pill"><span class="dot" style="background:${us ? 'var(--good)' : 'var(--bad)'}"></span>US ${us ? 'open' : 'closed'}</span>

    <button class="btn" data-act="live" aria-label="Refresh live prices" title="${D.settings.lastLive ? 'Last live refresh ' + new Date(D.settings.lastLive).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'Fetch live prices from Alpha Vantage'}" ${UI.live && UI.live.busy ? 'disabled' : ''}>${UI.live && UI.live.busy ? '<span class="spin"></span><span>' + UI.live.done + '/' + UI.live.total + '</span>' : ICON.refresh + '<span>Refresh</span>'}</button>
    <button class="btn" data-act="prices">${ICON.price}Update prices</button>
    <button class="fab" data-act="add" aria-label="Add a new holding" title="Add a new holding">${ICON.plus}</button>`;
  const brokers = [...new Set(D.holdings.map(h => h.broker).filter(Boolean))];
  $('#eyebrow').textContent = (brokers.length ? brokers.slice(0, 3).join(' + ') + (brokers.length > 3 ? ' +' + (brokers.length - 3) : '') : 'Portfolio desk') + ' · INR';
}
function renderTabs() {
  const t = [['portfolio', 'Portfolio', D.holdings.length], ['watchlist', 'Watchlist', D.watch.length], ['findings', 'Findings', computeFindings().filter(f => f.sev === 'high' || f.sev === 'med').length]];
  $('#tabs').innerHTML = t.map(([k, l, c]) => `<button class="tab" role="tab" aria-selected="${UI.tab === k}" data-act="tab" data-k="${k}">${l}<span class="count">${c}</span></button>`).join('');
}
function render() {
  renderTop(); renderTabs();
  if (UI.tab === 'portfolio') renderPortfolio();
  else if (UI.tab === 'watchlist') renderWatch();
  else renderFindings();
  renderFoot();
}
function renderFoot() {
  $('#foot').innerHTML = `
    <div><b>Refresh</b> pulls quotes from your Alpha Vantage connector: Indian stocks/ETFs via their BSE listing (Alpha Vantage doesn’t carry NSE), US stocks, USD/INR, USD/KWD, Bitcoin and gold/silver international spot (a green dot marks a live price). Quotes can be delayed or end-of-day depending on your Alpha Vantage plan; the free key allows 25 requests a day, so 3-month market history loads once a day and watchlist charts load when a ticker is added. Mutual fund NAVs sync nightly from mfapi.in using each fund’s AMFI scheme code (a green dot marks a synced NAV); you can still override them in <b>Update prices</b>. Day change needs a previous close. XIRR for SIPs is approximate (invested amount spread evenly across instalments).</div>
    <div>Watchlist analysis and the analyst brief are produced by Claude from its training knowledge — not live data — and may be outdated or wrong. Verify every figure with the exchange, company filings or your broker before acting. This is research support, not SEBI-registered investment advice.</div>`;
}
</script>
<script>
/* ============ PORTFOLIO TAB ============ */
function allEnriched() { return D.holdings.map(enrich); }
function passF(h) { return (UI.type === 'All' || h.type === UI.type) && (UI.broker === 'All' || h.broker === UI.broker) && (UI.mode === 'All' || h.mode === UI.mode); }

function renderPortfolio() {
  const all = allEnriched();
  const tv = sum(all, 'value'), ti = sum(all, 'inv'), tp = tv - ti, td = sum(all, 'day');
  const x = xirr(flowsFor(all)) * 100;
  const sipAll = all.filter(h => h.mode === 'SIP' && h.sipStatus !== 'Paused');
  const sipMo = sipAll.reduce((a, h) => a + sipMonthly(h) * fxRate(h.currency), 0);
  const counts = TYPE_ORDER.map(t => [t, all.filter(h => h.type === t).length]).filter(c => c[1]);
  const samples = D.holdings.some(h => h.sample);

  const stats = [
    ['Current value', inr(tv), '', 'Invested ' + inr(ti)],
    ["Day's change", sInr(td), cls(td), tv - td ? pct(td / (tv - td) * 100) : '—', cls(td)],
    ['Total P&L', sInr(tp), cls(tp), (ti ? pct(tp / ti * 100) : '—') + ' absolute', cls(tp)],
    ['XIRR', isFinite(x) ? pct(x).replace('+', '') : '—', isFinite(x) ? cls(x) : '', 'Annualised · approx.'],
    ['Monthly SIPs', inr(sipMo), '', sipAll.length + ' active SIP' + (sipAll.length === 1 ? '' : 's')],
    ['Holdings', String(all.length), '', counts.map(([t, n]) => n + ' ' + (t === 'mf' ? 'MF' : t === 'btc' ? 'BTC' : TYPES[t].one.toLowerCase())).join(' · ') || 'none yet']
  ];

  // allocation by type
  const C = 2 * Math.PI * 44; let acc = 0;
  const alloc = TYPE_ORDER.map(t => { const v = sum(all.filter(h => h.type === t), 'value'); return { t, v }; }).filter(a => a.v > 0);
  const donut = alloc.map(a => { const f = a.v / (tv || 1), len = f * C; const o = `<circle cx="60" cy="60" r="44" fill="none" stroke="${TYPES[a.t].hex}" stroke-width="16" stroke-dasharray="${Math.max(0, len - 1.5)} ${C}" stroke-dashoffset="${-acc}"></circle>`; acc += len; return o; }).join('');

  const brokers = [...new Set(all.map(h => h.broker || '—'))].map(b => { const h = all.filter(a => (a.broker || '—') === b), v = sum(h, 'value'), i = sum(h, 'inv'); return { b, v, p: v - i, pp: i ? (v - i) / i * 100 : 0, n: h.length }; }).sort((a, b) => b.v - a.v);
  const sipV = sum(all.filter(h => h.mode === 'SIP'), 'value'), lumpV = tv - sipV;
  const sipI = sum(all.filter(h => h.mode === 'SIP'), 'inv'), lumpI = ti - sipI;

  const brokerList = [...new Set(D.holdings.map(h => h.broker).filter(Boolean))];
  const chip = (grp, val, label) => `<button class="chip" aria-pressed="${UI[grp] === val}" data-act="filter" data-g="${grp}" data-v="${esc(val)}">${esc(label)}</button>`;

  const vis = all.filter(passF);
  const groups = TYPE_ORDER.filter(t => UI.type === 'All' || UI.type === t).map(t => ({ t, rows: vis.filter(h => h.type === t) })).filter(g => g.rows.length || UI.type === g.t);

  $('#view').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px;padding-top:16px">
    ${samples ? `<div class="banner"><span>You're looking at <b>sample holdings</b> (marked <span class="tag sample">SAMPLE</span>). Edit them into your real positions, or clear them and add your own with <b>+</b>.</span><button class="btn sm" data-act="clearSamples">Clear sample holdings</button></div>` : ''}
    <section class="stats">${stats.map(s => `<div class="stat" ${s[0] === 'Monthly SIPs' ? 'data-sip-tile tabindex="0" role="button" aria-label="Monthly SIPs — show upcoming SIPs" style="cursor:help"' : ''}><div class="l">${s[0]}${s[0] === 'Monthly SIPs' ? ' <span class="muted" style="font-size:11px">· upcoming ▾</span>' : ''}</div><div class="v ${s[2]}">${s[1]}</div><div class="s ${s[4] || ''}">${s[3]}</div></div>`).join('')}</section>

    ${sipApprovalSection()}

    <section class="grid3">
      <div class="panel pad" style="display:flex;flex-direction:column;gap:14px">
        <div class="ph"><h2>Asset allocation</h2><span class="sub">By holding type</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:18px;align-items:center">
          <svg viewBox="0 0 120 120" width="128" height="128" style="flex:none;transform:rotate(-90deg)" aria-hidden="true"><circle cx="60" cy="60" r="44" fill="none" stroke="#1F2833" stroke-width="16"></circle>${donut}</svg>
          <div style="flex:1;min-width:170px;display:flex;flex-direction:column;gap:8px">
            ${alloc.map(a => `<div class="legend-row"><span class="sw" style="background:${TYPES[a.t].hex}"></span><span style="flex:1;color:var(--text2)">${TYPES[a.t].label}</span><span class="mono muted" style="font-size:12px">${inr(a.v)}</span><span class="mono" style="width:50px;text-align:right">${(a.v / (tv || 1) * 100).toFixed(1)}%</span></div>`).join('') || '<span class="sub">Add a holding to see your mix.</span>'}
          </div>
        </div>
      </div>
      <div class="panel pad" style="display:flex;flex-direction:column;gap:14px">
        <div class="ph"><h2>Broker split</h2><span class="sub">Current value</span></div>
        <div class="bar">${brokers.map(b => `<div style="flex:${b.v || 0.0001};background:${brokerCol(b.b)}"></div>`).join('')}</div>
        <div style="display:flex;flex-direction:column;gap:0">
          ${brokers.map(b => `<div class="kv" style="padding-inline:0;font-family:var(--sans);font-size:13px;align-items:center"><span style="display:flex;gap:8px;align-items:center;min-width:0"><span class="sw" style="background:${brokerCol(b.b)}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.b)}</span><span class="muted mono" style="font-size:11px">${b.n}</span></span><span class="mono" style="text-align:right;white-space:nowrap">${inr(b.v)} <span class="${cls(b.p)}" style="font-size:11px">${pct(b.pp)}</span></span></div>`).join('')}
        </div>
      </div>
      <div class="panel pad" style="display:flex;flex-direction:column;gap:14px">
        <div class="ph"><h2>SIP vs Lumpsum</h2><span class="sub">How the money went in</span></div>
        <div class="bar"><div style="flex:${sipV || 0.0001};background:var(--good)"></div><div style="flex:${lumpV || 0.0001};background:var(--text2)"></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${[['SIP', sipV, sipI, 'var(--good)', all.filter(h => h.mode === 'SIP').length], ['Lumpsum', lumpV, lumpI, 'var(--text2)', all.filter(h => h.mode !== 'SIP').length]].map(([l, v, i, c, n]) => `
          <div class="tile"><div class="l" style="display:flex;gap:6px;align-items:center"><span class="sw" style="background:${c}"></span>${l} · ${n}</div><div class="v">${inr(v)}</div><div class="mono ${cls(v - i)}" style="font-size:12px">${sInr(v - i)} · ${i ? pct((v - i) / i * 100) : '—'}</div></div>`).join('')}
        </div>
      </div>
    </section>

    <section class="filters">
      <div class="chips"><span class="flabel">Type</span>${chip('type', 'All', 'All types')}${TYPE_ORDER.map(t => chip('type', t, TYPES[t].label)).join('')}</div>
      <div class="chips"><span class="flabel">Broker</span>${chip('broker', 'All', 'All brokers')}${brokerList.map(b => chip('broker', b, b)).join('')}</div>
      <div class="chips"><span class="flabel">Mode</span>${chip('mode', 'All', 'SIP + Lumpsum')}${chip('mode', 'SIP', 'SIP only')}${chip('mode', 'Lumpsum', 'Lumpsum only')}</div>
    </section>

    <section style="display:flex;flex-direction:column;gap:16px">
      ${groups.map(g => holdingCard(g.t, g.rows)).join('') || '<div class="panel empty">No holdings match these filters.</div>'}
    </section>

    ${sipSection(all)}
    ${moversSection(all)}
    ${fxSection()}
    ${refSection()}
  </div>`;
}

function holdingCard(t, rows) {
  const v = sum(rows, 'value'), p = v - sum(rows, 'inv');
  const hdr = { stock: ['Symbol · Qty @ Avg', 'LTP · Day', 'Invested', 'Value · P&L'], mf: ['Fund · Units @ Avg NAV', 'NAV · Day', 'Invested', 'Value · P&L'], etf: ['ETF · Units @ Avg', 'LTP · Day', 'Invested', 'Value · P&L'], gold: ['Holding · Grams @ Avg', 'Price /g', 'Invested', 'Value · P&L'], btc: ['Holding · BTC @ Avg', 'Price /BTC', 'Invested', 'Value · P&L'] }[t];
  return `<div class="panel hcard">
    <div class="hhead"><h2><span class="sw" style="background:${TYPES[t].hex}"></span>${TYPES[t].label} <span class="muted" style="font-weight:400">· ${rows.length}</span></h2>
      <span style="display:flex;gap:10px;align-items:center"><span class="mono ${cls(p)}" style="font-size:12px">${inr(v)} · ${sInr(p)}</span><button class="btn sm ghost" data-act="add" data-type="${t}">${ICON.plus}Add</button></span></div>
    <div class="hscroll"><div class="htable">
      <div class="hrow head"><span>${hdr[0]}</span><span style="text-align:right">${hdr[1]}</span><span style="text-align:right">${hdr[2]}</span><span style="text-align:right">${hdr[3]}</span><span></span></div>
      ${rows.length ? rows.map(holdingRow).join('') : `<div class="empty">No ${TYPES[t].label.toLowerCase()} yet. <button class="btn sm" data-act="add" data-type="${t}" style="margin-left:6px">${ICON.plus}Add ${TYPES[t].one.toLowerCase()}</button></div>`}
    </div></div>
  </div>`;
}
function holdingRow(h) {
  const cs = CUR_SYM[h.currency] || '₹', unit = h.type === 'btc' ? 8 : 2;
  const title = h.type === 'stock' || h.type === 'etf' ? (h.sym || h.name) : h.name;
  const subName = (h.type === 'stock' || h.type === 'etf') && h.name && h.name !== h.sym ? h.name : '';
  const qtyS = h.type === 'btc' ? num(+h.qty, 6) + ' BTC' : h.type === 'gold' ? num(+h.qty, 2) + ' g' : h.type === 'mf' ? num(+h.qty, 3) + ' u' : num(+h.qty, 0);
  const meta = [qtyS + ' @ ' + cs + num(+h.avg, 2)];
  if (h.type === 'mf') meta.push([h.category, h.plan].filter(Boolean).join(' · '));
  if (h.type === 'gold') meta.push([h.form, h.purity].filter(Boolean).join(' · '));
  if ((h.type === 'stock' || h.type === 'etf') && h.exchange) meta.push(h.exchange + (h.sector ? ' · ' + h.sector : h.underlying ? ' · ' + h.underlying : ''));
  if (h.mode === 'SIP') meta.push(cs + num(+h.sipAmt) + ' ' + (h.sipFreq || 'Monthly').toLowerCase() + ' · ' + sipCount(h) + ' instalments');
  else if (h.date) meta.push('Bought ' + fmtDate(h.date));
  const modeTag = h.mode === 'SIP' ? (h.sipStatus === 'Paused' ? '<span class="tag paused">SIP · PAUSED</span>' : '<span class="tag sip">SIP</span>') : '<span class="tag lump">LUMPSUM</span>';
  const dayS = isFinite(h.dayPct) ? `<span class="${cls(h.dayPct)}">${pct(h.dayPct)}</span>` : `<span class="muted">${h.useRef ? 'market ref' : '—'}</span>`;
  const confirm = UI.delId === h.id ? `<div class="confirm"><span>Delete <b>${esc(title)}</b> (${esc(h.broker || '')})? This can't be undone.</span><span style="display:flex;gap:8px"><button class="btn sm" data-act="delCancel">Keep it</button><button class="btn sm danger" data-act="delYes" data-id="${h.id}">Delete</button></span></div>` : '';
  return `<div class="hrow">
    <div class="hname">
      <div class="t"><span class="n">${esc(title)}</span><span class="tag" style="color:${brokerCol(h.broker)}">${esc(h.broker || '—')}</span>${modeTag}${h.sample ? '<span class="tag sample">SAMPLE</span>' : ''}</div>
      ${subName ? `<div class="m" style="font-family:var(--sans)">${esc(subName)}</div>` : ''}
      <div class="m">${meta.map(esc).join(' · ')}</div>
    </div>
    <div class="r"><span title="${h.priceSrc === 'live' ? 'Live · Alpha Vantage · ' + esc(h.priceAt || '') : h.priceSrc === 'mfapi' ? 'NAV ' + esc(h.navDate || h.priceAt || '') + ' · mfapi.in' : h.priceSrc === 'web' ? 'NAV ' + esc(h.navDate || h.priceAt || '') + ' · web (' + esc((h.navUrl || '').split('/')[2] || '') + ')' : h.priceSrc === 'nse' ? 'NSE · ' + esc(h.priceAt || '') : h.priceSrc === 'screener' ? 'screener.in · ' + esc(h.priceAt || '') : 'Entered by you · ' + esc(h.priceAt || '')}">${['live', 'mfapi', 'web', 'nse', 'screener'].includes(h.priceSrc) ? '<span class="dot" style="display:inline-block;width:6px;height:6px;background:var(--good);margin-right:5px;vertical-align:middle"></span>' : ''}${cs}${num(h.p, h.type === 'btc' ? 0 : 2)}</span>${dayS}</div>
    <div class="r"><span>${inr(h.inv)}</span><span class="muted">${h.held > 0 ? heldStr(h.held) : ''}</span></div>
    <div class="r"><span>${inr(h.value)}</span><span class="${cls(h.pnl)}">${sInr(h.pnl)} ${pct(h.pnlPct)}</span></div>
    <div class="acts"><button class="icon-btn" data-act="edit" data-id="${h.id}" aria-label="Edit ${esc(title)}" title="Edit">${ICON.edit}</button><button class="icon-btn del" data-act="del" data-id="${h.id}" aria-label="Delete ${esc(title)}" title="Delete">${ICON.del}</button></div>
    ${confirm}
  </div>`;
}
function heldStr(d) { if (d < 31) return d + 'd held'; const m = Math.floor(d / 30.44); return m < 12 ? m + 'm held' : (m / 12).toFixed(1) + 'y held'; }

function sipSection(all) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const list = all.filter(h => h.mode === 'SIP').map(h => ({ h, d: nextSip(h, today) })).sort((a, b) => (a.d ? a.d : 9e15) - (b.d ? b.d : 9e15));
  const mo = list.filter(x => x.d).reduce((a, x) => a + sipMonthly(x.h) * fxRate(x.h.currency), 0);
  return `<section class="panel" style="overflow:hidden">
    <div class="hhead"><h2>SIP schedule</h2><span class="mono muted" style="font-size:12px">${inr(mo)} / month · ${list.filter(x => x.d).length} active</span></div>
    ${list.length ? list.map(({ h, d }) => {
      const days = d ? daysBetween(today, d) : null, cs = CUR_SYM[h.currency] || '₹';
      const when = d == null ? 'Paused' : days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : 'in ' + days + ' days';
      const soon = d != null && days <= 3;
      const freq = h.sipFreq === 'Weekly' ? 'every ' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][+(h.sipWeekday ?? 1)] : (h.sipFreq === 'Quarterly' ? 'quarterly' : 'monthly') + ' on day ' + (h.sipDay || 1);
      return `<div class="siprow" style="${d ? '' : 'opacity:.55'}">
        <div class="cal ${soon ? 'soon' : ''}"><b>${d ? d.getDate() : '—'}</b><span>${d ? d.toLocaleDateString('en-IN', { month: 'short' }) : 'paused'}</span></div>
        <div style="min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${esc(h.type === 'stock' || h.type === 'etf' ? h.sym || h.name : h.name)}<span class="tag" style="color:${TYPES[h.type].hex}">${TYPES[h.type].one.toUpperCase()}</span></span><span class="sub">${esc(h.broker || '')} · ${freq}${+h.stepUp ? ' · step-up ' + h.stepUp + '%/yr' : ''}</span></div>
        <div class="r" style="text-align:right;display:flex;flex-direction:column;gap:3px;font-family:var(--mono)"><span style="font-size:14px">${cs}${num(+h.sipAmt)}</span><span style="font-size:11px;color:${soon ? 'var(--accent)' : 'var(--muted)'}">${when}</span></div>
      </div>`;
    }).join('') : '<div class="empty">No SIPs yet. When you add a holding, choose <b>SIP</b> as the investment mode.</div>'}
  </section>`;
}

function moversSection(all) {
  const m = all.filter(h => isFinite(h.dayPct)).map(h => ({ n: h.type === 'mf' || h.type === 'gold' ? h.name : (h.sym || h.name), p: h.dayPct, pr: h.p, cs: CUR_SYM[h.currency] || '₹' })).sort((a, b) => b.p - a.p);
  const up = m.filter(x => x.p >= 0).slice(0, 5), dn = m.filter(x => x.p < 0).reverse().slice(0, 5);
  const box = (title, col, sub, items, empty) => `<div class="panel pad" style="display:flex;flex-direction:column;gap:4px"><div class="ph" style="margin-bottom:6px"><h2 style="color:${col};font-size:14px">${title}</h2><span class="sub">${sub}</span></div>${items.map(x => `<div class="mover"><span class="n">${esc(x.n)}</span><span class="mono muted" style="font-size:12px">${x.cs}${num(x.pr, 2)}</span><span class="pct ${x.p >= 0 ? 'up' : 'dn'}">${pct(x.p)}</span></div>`).join('') || `<div class="sub" style="padding:8px 0">${empty}</div>`}</div>`;
  const N5 = D.nse, nm = arr => (arr || []).slice(0, 5).map(x => ({ n: x.sym, p: +x.pct, pr: +x.ltp, cs: '₹' }));
  const t = s => s ? String(s).replace(/:\d\d$/, '') : '';
  return `<section class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))">
    ${box('NSE top gainers', 'var(--good)', 'NIFTY 50 · ' + (N5 ? esc(t(N5.gainersAt)) + ' IST' : 'awaiting sync'), N5 ? nm(N5.gainers) : [], 'Syncs from nseindia.com on market days.')}
    ${box('NSE top losers', 'var(--bad)', 'NIFTY 50 · ' + (N5 ? esc(t(N5.losersAt)) + ' IST' : 'awaiting sync'), N5 ? nm(N5.losers) : [], 'Syncs from nseindia.com on market days.')}
    ${box('My gainers today', 'var(--good)', 'Holdings with a previous close', up, 'No holding with a previous close is up.')}
    ${box('My losers today', 'var(--bad)', 'Holdings with a previous close', dn, 'No holding with a previous close is down.')}
  </section>`;
}
function fxSection() {
  const f = D.settings.fx, fx = { INR: f.usdInr, USD: 1, KWD: f.usdKwd };
  const f4 = (v, d) => v.toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const names = { INR: ['Indian Rupee', '₹', 2], USD: ['US Dollar', '$', 2], KWD: ['Kuwaiti Dinar', 'KD ', 3] };
  const amt = parseFloat(UI.convAmt) || 0;
  const out = ['INR', 'USD', 'KWD'].filter(c => c !== UI.convFrom).map(c => `<div class="kv" style="border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--sans);align-items:baseline"><span class="muted" style="font-size:13px">${names[c][0]}</span><span class="mono" style="font-size:19px;font-weight:500">${names[c][1]}${f4(amt / fx[UI.convFrom] * fx[c], names[c][2])}</span></div>`).join('');
  return `<section class="panel pad grid2" style="gap:24px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="ph"><h2>Currency</h2><span class="sub">Rates set ${D.settings.ref.at ? fmtDate(D.settings.ref.at) : 'as sample — update them'}</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <div class="tile"><div class="l">USD → INR</div><div class="v">₹${f4(f.usdInr, 2)}</div></div>
        <div class="tile"><div class="l">KWD → INR</div><div class="v">₹${f4(f.usdInr / f.usdKwd, 2)}</div></div>

/* ============ interactive line chart ============ */
const CHARTS = {};
function fmtD(d, long) { const x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-IN', long ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' }); }
function chartHTML(id, pts, o = {}) {
  pts = (pts || []).filter(p => p && isFinite(p[1]));
  const H0 = o.h || 150;
  if (pts.length < 2) return `<div class="sub" style="height:${H0}px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line3);border-radius:8px;text-align:center;padding:10px">${o.empty || 'No history yet.'}</div>`;
  const W = 1000, H = H0, PT = 8, PB = 8, pw = W, ph = H - PT - PB;
  const vs = pts.map(p => p[1]), v2 = o.pts2 ? o.pts2.map(p => p[1]) : []; let mn = Math.min(...vs, ...v2), mx = Math.max(...vs, ...v2); const pad = (mx - mn) * 0.08 || mx * 0.02 || 1; mn -= pad; mx += pad;
  const n = pts.length, X = i => i / (n - 1) * pw, Y = v => PT + (1 - (v - mn) / (mx - mn)) * ph;
  const col = o.col || '#D9B45B', f = o.fmt || (v => num(v, 2));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ');
  const line2 = o.pts2 ? o.pts2.map((p, i) => (i ? (o.step ? 'H' + X(i).toFixed(1) + ' V' : 'L' + X(i).toFixed(1) + ',') : 'M' + X(i).toFixed(1) + ',') + Y(p[1]).toFixed(1)).join(' ') : '';
  const ticks = [mx - pad, (mx + mn) / 2, mn + pad];
  const xi = [0, Math.floor((n - 1) / 2), n - 1];
  CHARTS[id] = { pts, W, H, pw, X, Y, col, f, sub: o.sub, long: o.long, pts2: o.pts2, lab: o.lab, lab2: o.lab2 };
  const pctY = v => (Y(v) / H * 100).toFixed(2) + '%';
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px">
    <div class="chart" data-chart="${id}" style="height:${H}px">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px" role="img" aria-label="${esc(o.label || 'Price chart')}">
        <defs><linearGradient id="cg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".26"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
        ${ticks.map(t => `<line x1="0" x2="${pw}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#1F2833" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('')}
        <line x1="0" x2="${pw}" y1="${Y(vs[0]).toFixed(1)}" y2="${Y(vs[0]).toFixed(1)}" stroke="#2A3542" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
        <path d="${line} L${pw},${PT + ph} L0,${PT + ph} Z" fill="url(#cg-${id})"/>
        <path d="${line}" fill="none" stroke="${col}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
        ${line2 ? `<path d="${line2}" fill="none" stroke="${o.col2 || '#8B98A5'}" stroke-width="1.6" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>` : ''}
      </svg>
      <span style="position:absolute;right:-4px;top:${pctY(vs[n - 1])};width:8px;height:8px;border-radius:50%;background:${col};transform:translateY(-50%)"></span>
      <span class="cline" hidden></span><span class="cdot" hidden style="background:${col}"></span><div class="ctip" hidden></div>
    </div>
    <div style="position:relative;height:${H}px;min-width:44px">${ticks.map(t => `<span class="mono" style="position:absolute;right:0;top:${pctY(t)};transform:translateY(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap">${esc(f(t, true))}</span>`).join('')}</div>
    <div class="mono" style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding-top:4px">${xi.map(i => `<span>${esc(fmtD(pts[i][0], o.long))}</span>`).join('')}</div><span></span>
  </div>`;
}
function chartHover(el, clientX) {
  const c = CHARTS[el.dataset.chart]; if (!c) return;
  const svg = el.querySelector('svg'), r = svg.getBoundingClientRect(), sx = r.width / c.W, sy = r.height / c.H;
  const n = c.pts.length, i = Math.max(0, Math.min(n - 1, Math.round((clientX - r.left) / sx / c.pw * (n - 1))));
  const px = c.X(i) * sx, py = c.Y(c.pts[i][1]) * sy;
  const ln = el.querySelector('.cline'), dt = el.querySelector('.cdot'), tp = el.querySelector('.ctip');
  ln.hidden = dt.hidden = tp.hidden = false;
  ln.style.left = px + 'px'; ln.style.height = r.height + 'px';
  dt.style.left = px + 'px'; dt.style.top = py + 'px';
  const chg = (c.pts[i][1] / c.pts[0][1] - 1) * 100;
  if (c.pts2) { const a = c.pts2[i][1], v = c.pts[i][1]; tp.innerHTML = `${esc(c.lab || 'Value')} ${esc(c.f(v))}<span>${esc(c.lab2 || 'Invested')} ${esc(c.f(a))} · ${a ? pct((v / a - 1) * 100) : '—'}</span><span>${esc(fmtD(c.pts[i][0], true))}</span>`; }
  else tp.innerHTML = `${esc(c.f(c.pts[i][1]))}${c.sub ? '<span>' + esc(c.sub(c.pts[i][1])) + '</span>' : ''}<span>${esc(fmtD(c.pts[i][0], true))} · ${pct(chg)} from start</span>`;
  const tw = tp.offsetWidth / 2; tp.style.left = (tw * 2 >= r.width ? r.width / 2 : Math.min(Math.max(px, tw), r.width - tw)) + 'px'; tp.style.top = Math.max(py - 8, 0) + 'px';
}
function chartOut(el) { el.querySelectorAll('.cline,.cdot,.ctip').forEach(x => x.hidden = true); }
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-chart]'); document.querySelectorAll('[data-chart]').forEach(c => { if (c !== el) chartOut(c); }); if (el) chartHover(el, e.clientX); });
document.addEventListener('pointerleave', e => { document.querySelectorAll('[data-chart]').forEach(chartOut); }, true);

/* ============ markets: gold, silver, bitcoin, oil ============ */
function mktSeries(k) {
  const m = D.market; if (!m || !m.series || !m.series[k]) return [];
  const pts = m.series[k].slice();
  const lv = m.live && m.live[k];
  if (lv && lv.v && lv.t) { if (pts.length && pts[pts.length - 1][0] === lv.t) pts[pts.length - 1] = [lv.t, lv.v]; else if (!pts.length || lv.t > pts[pts.length - 1][0]) pts.push([lv.t, lv.v]); }
  const cut = new Date(Date.now() - 92 * 864e5).toISOString().slice(0, 10);
  return pts.filter(p => p[0] >= cut);
}

      const pts = mktSeries(d.k), n = pts.length, last = n ? pts[n - 1] : null;
      const vs = pts.map(p => p[1]), m3 = n > 1 ? (vs[n - 1] / vs[0] - 1) * 100 : NaN, dchg = n > 1 ? (vs[n - 1] / vs[n - 2] - 1) * 100 : NaN;

  </section>`;

async function loadPx(k) {

  try {

      ${ref != null ? `<span title="Current price" style="position:absolute;top:9px;left:calc(${X(ref)}% - 8px);width:16px;height:16px;border-radius:50%;background:var(--text);border:3px solid var(--bg)"></span>` : ''}

  }
  const lg = (c, l, v, shape) => `<div class="kv" style="padding:6px 0;font-family:var(--sans);font-size:12.5px"><span style="display:flex;gap:8px;align-items:center"><span style="width:${shape === 'dot' ? 10 : 4}px;height:10px;border-radius:${shape === 'dot' ? '50%' : '2px'};background:${c}"></span>${l}</span><span class="mono">${v}</span></div>`;
  const up = (v) => { const n = N(v); return n != null && ref ? ` <span class="${cls(n - ref)}" style="font-size:11px">${pct((n / ref - 1) * 100)}</span>` : ''; };

    <div class="note">Analysed ${a.at ? new Date(a.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}${a.ltpUsed != null ? ' against your price ' + cs + num(a.ltpUsed, 2) : ' without a current price (levels may be stale)'} · generated by Claude from training knowledge, not live data · not investment advice.</div>`;

function analysisPrompt(w) {

Company (as entered by the investor): ${w.name || 'not given'}
Today's date: ${today}
${ltp != null ? `The investor reports the current market price is ${ltp} ${cur} as of ${w.ltpAt || today}. Anchor all price targets, entry zones and the stop-loss to THIS price.` : `No current price was supplied. Give your last-known price as refPrice, say in refPriceNote when it is from, and note in caveats that levels may be stale.`}

HONESTY RULES (mandatory):
- You have no live market data and no internet access. Use only what you know from training; state the period your figures reflect in "dataAsOf" (e.g. "FY2025 annual results; model knowledge to mid-2025").
- If you are not confident in a figure, use null and explain in the note. Never guess precise numbers you don't know.
- Never invent URLs, report titles, analyst names or quotes. In risk.sources list only real, checkable primary source types a reader can look up (e.g. "Company annual report FY2025", "NSE corporate filings", "SEC Form 10-K 2024", "Screener.in financials page") — no URLs.
- If the ticker is unknown or ambiguous on this exchange, set "found": false and explain in "summary".
- Keep language simple; each "note"/"verdict" is one or two plain sentences a non-expert understands.

METHOD:
a) P/E: trailing P/E vs the average of its sector/industry peers in its home market. verdict = is it expensive or cheap vs peers and whether that is justified.
b) Revenue: the last 5 fiscal years (label years as the company does, e.g. "FY21" or "2021"), in ₹ crore for Indian companies or USD billions for US companies (state unit). cagr = compound annual growth % across the series. trend = "Rising" | "Mixed" | "Falling".
c) Debt-to-equity: latest total debt / shareholder equity. level: "Low" (<0.5), "Moderate" (0.5-1.5), "High" (>1.5), or "Not meaningful" for banks/NBFCs/insurers (explain which metric to use instead).

{"found":true,"ticker":"${w.t}","name":"","exchange":"${w.ex}","currency":"${cur}","sector":"","dataAsOf":"","refPrice":null,"refPriceNote":"","summary":"2-3 sentence plain-English overview and overall stance","confidence":"High|Medium|Low",
"pe":{"stock":0,"sectorAvg":0,"verdict":"","note":""},
"revenue":{"unit":"","years":[{"year":"FY21","value":0}],"cagr":0,"trend":"","note":""},
"debtToEquity":{"value":0,"level":"","note":""},
"dividend":{"yieldPct":0,"payoutPct":0,"score":0,"label":"","note":""},
"moat":{"rating":"","reasons":[""],"summary":""},
"targets12m":{"bull":{"price":0,"thesis":""},"base":{"price":0,"thesis":""},"bear":{"price":0,"thesis":""},"note":""},
"risk":{"score":0,"reasons":[""],"sources":[""],"summary":""},
"entry":{"zoneLow":0,"zoneHigh":0,"stopLoss":0,"note":""},
"caveats":[""]}`;
}
const SAMPLE_ERR = { not_granted: 'Claude access was not allowed for this page. Reload and allow it to run analysis.', sampling_disabled: 'Claude isn’t available for this account.', rate_limited: 'Too many requests right now, or your usage limit was reached. Try again in a few minutes.', session_expired: 'Your session expired — sign in to Claude again.', refused: 'Claude declined this request. Try a different ticker or wording.', invalid_json: 'The answer came back in an unexpected format. Tap Re-run to try again.', empty_completion: 'No answer came back. Tap Run analysis to try again.', prompt_too_large: 'The request was too large.', upstream_error: 'The connection dropped part-way. Tap Run analysis to try again.' };
const errCopy = e => SAMPLE_ERR[e && e.code] || ('Something went wrong' + (e && e.code ? ' (' + e.code + ')' : '') + '. Try again.');

async function runAnalysis(k) {
  const w = D.watch.find(x => wKey(x) === k); if (!w || !SAMPLE || UI.busy[k]) return;
  UI.busy[k] = true; UI.err[k] = null; UI.open[k] = true; render();
  const ctl = ctlAn[k] = new AbortController();
  try {
    const r = await SAMPLE.json(analysisPrompt(w), { signal: ctl.signal, cache: false });
    if (!r || typeof r !== 'object') throw { code: 'invalid_json' };
    const a = { ...r, key: k, at: new Date().toISOString(), ltpUsed: N(w.ltp) };
    D.analyses[k] = a; saveAnalysis(k, a);
    if (w.sample) { w.sample = false; saveWatch(); }
    toast(w.t + ' analysis ready');
  } catch (e) {
    if (!(e && e.code === 'cancelled')) UI.err[k] = errCopy(e);
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) SAMPLE = null;
  } finally { UI.busy[k] = false; delete ctlAn[k]; render(); }
}
function addWatch(t, ex, name, ltp) {
  t = String(t || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!t) return 'Enter a ticker symbol.';
  if (!/^[A-Z0-9&.\-_^]{1,20}$/.test(t)) return 'Tickers use letters, numbers, &, . or - only.';
  if (D.watch.some(w => w.t === t && w.ex === ex)) return t + ' on ' + ex + ' is already on your watchlist.';
  const p = N(ltp);
  D.watch.unshift({ t, ex, name: String(name || '').trim(), ltp: p != null && p > 0 ? p : null, ltpAt: p ? todayISO() : null, added: todayISO() });
  UI.open[t + ':' + ex] = true;
  saveWatch(); render(); toast(t + ' added to watchlist');

}

<script>

/* ============ portfolio analytics (Findings) ============ */
function sectorGroup(h) {
  const n = (h.name || '').toLowerCase(), c = (h.category || '').toLowerCase(), u = (h.underlying || '').toLowerCase();
  if (h.type === 'gold') return 'Gold';
  if (h.type === 'btc') return 'Crypto';
  if (h.type === 'stock') return h.sector || 'Other stocks';
  if (h.type === 'etf') {
    if (/gold/.test(c)) return 'Gold'; if (/silver/.test(c)) return 'Silver';
    if (/cpse|psu/.test(n + u)) return 'PSU / CPSE';
    if (/international/.test(c)) return 'International equity';
    if (/midcap|mid cap/.test(n + u)) return 'Mid cap';
    if (/debt|liquid/.test(c)) return 'Debt / liquid';
    return 'Large & broad market';
  }
  if (/health|pharma/.test(n)) return 'Healthcare & pharma';
  if (/psu/.test(n)) return 'PSU / CPSE';
  if (/manufactur/.test(n)) return 'Manufacturing';
  if (/ethical|shariah/.test(n)) return 'Ethical / Shariah';
  if (/small/.test(n + c)) return 'Small cap';
  if (/midcap|mid cap|momentum/.test(n) && !/large/.test(n)) return 'Mid cap';
  if (/large and mid|large & mid|large and midcap/.test(n + ' ' + c)) return 'Large & mid cap';
  if (/flexi|multi/.test(n + c)) return 'Flexi / multi cap';
  if (/gold/.test(n + c)) return 'Gold';
  if (/debt|liquid|gilt|bond/.test(c)) return 'Debt / liquid';
  return 'Large & broad market';
}
const SECTOR_COL = ['#6FA8FF', '#A08CF5', '#43C6C0', '#D9B45B', '#F07B3F', '#E58FB8', '#8FD3E5', '#9BD88F', '#E5A98F', '#C8B560', '#B3A4F2', '#8FB8A8'];

  const rows = Object.entries(g).sort((a, b) => b[1].v - a[1].v), tv = rows.reduce((a, r) => a + r[1].v, 0) || 1, mx = Math.max(...rows.map(r => Math.max(r[1].v, r[1].i)), 1);
  return `<div class="panel pad" style="display:flex;flex-direction:column;gap:12px">
    <div class="ph"><h2>By sector &amp; theme</h2><span class="sub">Current value vs amount invested</span></div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted)"><span style="display:flex;gap:6px;align-items:center"><span class="sw" style="background:var(--accent)"></span>Current value</span><span style="display:flex;gap:6px;align-items:center"><span style="width:2px;height:12px;background:var(--text)"></span>Invested</span></div>

    ${rows.map(([k, r], idx) => { const pl = r.i ? (r.v / r.i - 1) * 100 : 0; return `<div style="display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(k)} · ${r.n} holding${r.n > 1 ? 's' : ''}">${esc(k)} <span class="muted mono" style="font-size:10.5px">${r.n}</span></span>
      <div style="position:relative;height:14px;background:var(--line);border-radius:3px"><div style="position:absolute;left:0;top:0;bottom:0;width:${(r.v / mx * 100).toFixed(1)}%;background:${SECTOR_COL[idx % SECTOR_COL.length]};border-radius:3px;opacity:.9"></div><div title="Invested ${inr(r.i)}" style="position:absolute;top:-3px;bottom:-3px;left:calc(${(r.i / mx * 100).toFixed(1)}% - 1px);width:2px;background:var(--text)"></div></div>
      <span class="mono" style="text-align:right;white-space:nowrap">${(r.v / tv * 100).toFixed(1)}% <span class="${cls(pl)}" style="font-size:11px">${pct(pl)}</span></span>
    </div>`; }).join('')}
    </div>
    <p class="note" style="margin:0">Direct stocks use their sector; funds and ETFs are grouped by what they invest in (sector/theme funds by theme, diversified funds by market-cap style). Hover a label for the number of holdings.</p>

function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); out += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) close();
    else { close(); out += `<p>${inline(l)}</p>`; }
  });
  close(); return out;
}

  const wq = Object.keys(seen).filter(q => !hq.includes(q));
  const HA = (D.market && D.market.histAt) || {}, td0 = todayISO();
  const needH = k => !D.market || !D.market.series || !D.market.series[k] || (HA[k] || D.market.fetchedAt || '') < td0;
  jobs.push({ kind: 'fx', from: 'USD', to: 'INR' }, { kind: 'metal', sym: 'GOLD' }, { kind: 'metal', sym: 'SILVER' }, { kind: 'fx', from: 'BTC', to: 'USD' }, { kind: 'fx', from: 'USD', to: 'KWD' });
  const HJ = { gold: { tool: 'GOLD_SILVER_HISTORY', input: { symbol: 'GOLD', interval: 'daily', datatype: 'csv' } }, silver: { tool: 'GOLD_SILVER_HISTORY', input: { symbol: 'SILVER', interval: 'daily', datatype: 'csv' } }, btc: { tool: 'DIGITAL_CURRENCY_DAILY', input: { symbol: 'BTC', market: 'USD', datatype: 'csv' } }, oil: { tool: 'WTI', input: { interval: 'daily', datatype: 'csv' } } };
  ['gold', 'silver', 'btc', 'oil'].forEach(k => { if (needH(k)) jobs.push({ kind: 'hist', k, ...HJ[k] }); });
  const budget = Math.max(0, 24 - avQuota().n);
  const skipped = [];
  hq.forEach(q => { if (jobs.length < budget) jobs.push({ kind: 'q', q }); else skipped.push(q); });
  const wAge = q => { const w = (seen[q] || []).find(x => !x.type); return w && w.ltpAt ? w.ltpAt : '0'; };
  wq.slice().sort((a, b) => wAge(a) < wAge(b) ? -1 : 1).forEach(q => { if (jobs.length < budget) jobs.push({ kind: 'q', q }); else skipped.push(q); });
  const R = UI.live = { busy: true, done: 0, total: jobs.length, ok: 0, miss: [], limit: false, fatal: null, at: null, navN, mkt: [], skipped };
  renderTop(); renderLiveBar();
  const fx = {}, metal = {}, today = todayISO(), hist = {};
  for (const j of jobs) {
    if (R.limit || R.fatal) break;
    try {
      if (j.kind === 'q') {
        const p = await avCall('GLOBAL_QUOTE', { symbol: j.q, datatype: 'json' });
        const pr = avProblem(p);
        if (pr === 'limit') { R.limit = true; break; }
        const g = p && p['Global Quote'];
        const price = g && avNum(g['05. price']), prev = g && avNum(g['08. previous close']), day = g && g['07. latest trading day'];
        if (price == null) { R.miss.push(j.q); }
        else {
          R.ok++;
          seen[j.q].forEach(x => {
            if (x.type) { x.price = price; x.prev = prev; x.priceAt = day || today; x.priceSrc = 'live'; }
            else { x.ltp = price; x.ltpAt = day || today; }
          });
        }
      } else if (j.kind === 'fx') {
        const p = await avCall('CURRENCY_EXCHANGE_RATE', { from_currency: j.from, to_currency: j.to, datatype: 'json' });
        if (avProblem(p) === 'limit') { R.limit = true; break; }
        const v = avNum(p && p['Realtime Currency Exchange Rate'] && p['Realtime Currency Exchange Rate']['5. Exchange Rate']);
        if (v) { fx[j.from + j.to] = v; R.ok++; } else R.miss.push(j.from + '/' + j.to);
      } else if (j.kind === 'metal') {
        const p = await avCall('GOLD_SILVER_SPOT', { symbol: j.sym });
        if (avProblem(p) === 'limit') { R.limit = true; break; }
        const v = avNum(p && p.price);
        if (v) { metal[j.sym] = v; R.ok++; } else R.miss.push(j.sym === 'GOLD' ? 'Gold spot' : 'Silver spot');
      } else {
        const p = await avCall(j.tool, j.input);
        if (avProblem(p) === 'limit') { R.limit = true; break; }
        const pts = parseAvCsv(p);
        if (pts.length > 5) { hist[j.k] = pts.slice(-95); R.ok++; } else R.miss.push(j.k + ' history');
      }
    } catch (e) {
      if (e && e.code === 'tool_error') R.miss.push(j.q || (j.from ? j.from + '/' + j.to : j.sym || j.k));
      else if (e && e.retryable) { R.miss.push(j.q || j.sym || j.from || j.k); }
      else { R.fatal = liveErrCopy(e); break; }
    }
    R.done++; renderTop(); renderLiveBar();
  }
  if (R.limit) { const q = avQuota(); q.limit = true; D.settings.av = q; }
  // market history + live points
  D.market = D.market || { v: 1, series: {} };
  D.market.series = D.market.series || {};
  D.market.histAt = Object.assign({}, D.market.histAt || {});
  Object.keys(hist).forEach(k => { D.market.series[k] = hist[k]; D.market.histAt[k] = today; });
  if (hist.gold && hist.btc) D.market.fetchedAt = today;
  const lv = D.market.live = Object.assign({}, D.market.live || {});
  const upsert = (k, v) => { const ser = (D.market.series[k] = (D.market.series[k] || []).filter(p => p[0] !== today)); ser.push([today, v]); ser.sort((a, b) => a[0] < b[0] ? -1 : 1); if (ser.length > 120) ser.splice(0, ser.length - 120); };
  const nowIso = new Date().toISOString();
  if (metal.GOLD) { lv.gold = { v: metal.GOLD, t: today, at: nowIso, src: 'Alpha Vantage' }; upsert('gold', metal.GOLD); R.mkt.push('Gold'); }
  if (metal.SILVER) { lv.silver = { v: metal.SILVER, t: today, at: nowIso, src: 'Alpha Vantage' }; upsert('silver', metal.SILVER); R.mkt.push('Silver'); }
  if (fx.BTCUSD) { lv.btc = { v: fx.BTCUSD, t: today, at: nowIso, src: 'Alpha Vantage' }; upsert('btc', fx.BTCUSD); R.mkt.push('Bitcoin'); }
  if (hist.oil) R.mkt.push('Oil');
  if (metal.GOLD || fx.BTCUSD || metal.SILVER) lv.at = nowIso;
  if (Object.keys(hist).length || metal.GOLD || fx.BTCUSD || metal.SILVER) Store.save('market', D.market);
  // apply macro
  const S = D.settings, prem = 1 + (+S.ref.prem || 0) / 100;
  if (fx.USDINR) S.fx.usdInr = +fx.USDINR.toFixed(4);
  if (fx.USDKWD) S.fx.usdKwd = +fx.USDKWD.toFixed(5);
  const pushH = (k, v) => { S.refHist = S.refHist || {}; const h = S.refHist[k] = (S.refHist[k] || []).filter(p => p.t !== today); h.push({ t: today, v }); if (h.length > 90) h.splice(0, h.length - 90); };
  if (metal.GOLD) { S.ref.gold = Math.round(metal.GOLD * S.fx.usdInr / OZ * prem); pushH('gold', S.ref.gold); }
  if (metal.SILVER) { S.ref.silver = Math.round(metal.SILVER * S.fx.usdInr / OZ * 1000 * prem); pushH('silver', S.ref.silver); }
  if (fx.BTCUSD) { S.ref.btc = Math.round(fx.BTCUSD * S.fx.usdInr); pushH('btc', S.ref.btc); }
  if (fx.USDINR || metal.GOLD || fx.BTCUSD) S.ref.at = today;
  R.busy = false; R.at = new Date().toISOString();
  S.lastLive = R.at;
  if (R.ok || navN) { savePortfolio(); saveWatch(); }
  render(); renderLiveBar();
  toast(R.fatal ? 'Live refresh stopped' : R.limit ? 'Alpha Vantage limit reached · ' + R.ok + ' updated' : 'Live prices updated · ' + R.ok + ' of ' + R.total);
}
function renderLiveBar() {
  let el = $('#liveBar');
  const R = UI.live;
  if (!R) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'liveBar'; const tabs = $('#tabs'); tabs.parentNode.insertBefore(el, tabs.nextSibling); el.style.marginTop = '4px'; }
  const mfN = D.holdings.filter(h => h.type === 'mf').length;
  const pctDone = R.total ? Math.round(R.done / R.total * 100) : 0;
  let msg, tone = 'var(--line3)';
  if (R.busy) msg = `<span class="spin"></span><span>Fetching live prices from Alpha Vantage… ${R.done}/${R.total}</span>`;
  else if (R.fatal) { tone = 'var(--bad)'; msg = `<span>${esc(R.fatal)}</span>`; }
  else {
    const parts = [`<b style="color:var(--text)">${R.ok}</b> of ${R.total} prices updated ${new Date(R.at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}`];
    const ml = D.market && D.market.live;
    parts.push(R.mkt && R.mkt.length ? `Markets updated: ${R.mkt.join(', ')}.` : `Markets: Alpha Vantage didn't return new prices this time${ml && ml.at ? ' — showing the last update from ' + new Date(ml.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + (ml.src ? ' (' + esc(ml.src) + ')' : '') : ''}. The scheduled web sync also refreshes them at 12:00, 16:00 and 23:00 IST.`);
    if (R.limit) { tone = 'var(--warn)'; parts.push('Alpha Vantage’s free-key daily limit (25 requests) has been reached — the rest keep their last price. Market prices still update from the scheduled web sync (12:00, 16:00, 23:00 IST).'); }
    else { const q = avQuota(); parts.push(`<span class="muted">Alpha Vantage calls from this page today: ${q.n} of ~25 (3-month history loads once a day)</span>`); }
    if (R.skipped && R.skipped.length) parts.push(`${R.skipped.length} quote${R.skipped.length > 1 ? 's were' : ' was'} left for later to stay within the free key’s 25 requests/day (markets are always fetched first): ${R.skipped.slice(0, 8).map(esc).join(', ')}${R.skipped.length > 8 ? '…' : ''}. The scheduled web sync covers your Indian stocks and ETFs.`);
    if (R.miss.length) parts.push(`Not found: ${R.miss.slice(0, 8).map(esc).join(', ')}${R.miss.length > 8 ? '…' : ''} — edit the holding and set its <b>Live quote symbol</b> (e.g. the BSE code).`);
    if (mfN) { const noCode = D.holdings.filter(h => h.type === 'mf' && !h.code).length; const nd0 = D.holdings.filter(h => h.type === 'mf' && h.priceSrc === 'mfapi' && h.priceAt).map(h => h.priceAt).sort().pop(); const nd = nd0 ? fmtDate(nd0) : ''; parts.push(`Mutual funds: ${R.navN ? R.navN + ' NAV' + (R.navN > 1 ? 's' : '') + ' updated from mfapi.in' : 'NAVs sync nightly from mfapi.in'}${nd ? ' · latest NAV date ' + esc(nd) : ''}${noCode ? ` · ${noCode} fund${noCode > 1 ? 's have' : ' has'} no AMFI scheme code — add it so the NAV can sync` : ''}.`); }
    msg = `<span style="display:flex;flex-direction:column;gap:3px">${parts.map(x => `<span>${x}</span>`).join('')}</span>`;
  }
  el.innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 14px;border:1px solid ${tone};border-radius:10px;font-size:12.5px;color:var(--text2);line-height:1.55;position:relative;overflow:hidden">
    <span style="display:flex;gap:10px;align-items:center">${msg}</span>
    ${R.busy ? '' : `<button class="icon-btn" data-act="liveDismiss" aria-label="Dismiss">${ICON.x}</button>`}
    ${R.busy ? `<span style="position:absolute;left:0;bottom:0;height:2px;width:${pctDone}%;background:var(--accent);transition:width .3s"></span>` : ''}
  </div>`;
}
function openLiveHelp() {
  UI.modal = { kind: 'live', draft: {}, errors: {} };
  $('#modalRoot').innerHTML = `<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" style="max-width:520px">
    <div class="mhead"><h2 id="mTitle">Live prices need Claude</h2><button class="icon-btn" data-act="close" aria-label="Close">${ICON.x}</button></div>
    <div class="mbody" style="gap:12px;font-size:14px;line-height:1.6;color:var(--text2)">
      <p style="margin:0">Live refresh uses your <b style="color:var(--text)">Alpha Vantage</b> connector, which is only reachable when this page is opened inside Claude while you're signed in. If you are in Claude, reload the page and allow Alpha Vantage when asked.</p>
      <p class="note" style="margin:0">You can still enter today’s prices yourself with Update prices.</p>
    </div>
    <div class="mfoot"><span></span><span style="display:flex;gap:8px"><button class="btn ghost" data-act="close">Close</button><button class="btn primary" data-act="livePrices">Update prices manually</button></span></div>
  </div></div>`;
}

/* ============ boot ============ */
(async function boot() {
  const h = (location.hash || '').slice(1);
  if (['portfolio', 'watchlist', 'findings'].includes(h)) UI.tab = h;
  else { try { const t = localStorage.getItem('pfdui_tab'); if (t) UI.tab = t; } catch (e) {} }
  try { applyLoaded(await Store.loadAll()); } catch (e) {}
  render();
  const sampleP = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);
  const ok = await Store.init();
  if (ok) {
    try {
      const all = await Store.loadAll();
      if (all.portfolio || all.watchlist) applyLoaded(all);
      else { savePortfolio(); saveWatch(); }
      setSync('cloud');
    } catch (e) { setSync('error', e && e.code); }
  } else setSync('local');
  if (D.settings && !D.settings.sipApprovalsFrom) { D.settings.sipApprovalsFrom = todayISO(); savePortfolio(); }
  SAMPLE = await sampleP;
  try { MCP = (window.claude && window.claude.use) ? await window.claude.use('mcp') : null; } catch (e) { MCP = null; }
  render();
  setInterval(renderTop, 60000);
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && Store.mode === 'cloud' && !UI.modal) { const n = await pullNavs(); if (n) { savePortfolio(); render(); toast(n + ' NAV' + (n > 1 ? 's' : '') + ' updated from mfapi.in'); } } });
})();
</script>
